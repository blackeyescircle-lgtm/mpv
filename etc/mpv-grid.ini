; mpv Grid default configuration (UTF-8)
; Put this file next to mpv-grid.exe. Restart the player after editing it.
; Lines beginning with ; or # are comments. Use key=value without quotes.

[settings]
; Restore the last layout. The first launch uses 2x2.
grid=auto
; Number of tiles mixed into audio at the same time (1-16).
grid-audio-count=3
osd-bar=yes
osd-level=1

; Windows Grid mode already defaults to the following values. Remove the
; leading semicolon only when you want to force them in 1x1 mode as well.
;vo=gpu-next
;gpu-api=d3d11
;hwdec=d3d11va-copy

; Other mpv options can be placed here, for example:
;volume=80
;sub-auto=fuzzy
;fullscreen=yes

[keys]
; These bindings remain available in 1x1 mode.
F1=grid-desktop-shortcut
F2=grid-resume-project
WHEEL_UP=grid-hover-seek 5
WHEEL_DOWN=grid-hover-seek -5
Shift+WHEEL_UP=grid-hover-seek 5
Shift+WHEEL_DOWN=grid-hover-seek -5
ESC=quit

; Layout shortcuts. 0 is retained as a compatible 1x1 alias.
0=grid-disable
1=grid-disable
2=grid-layout 2 2
3=grid-layout 3 3
4=grid-layout 4 4
5=grid-layout 2 3
6=grid-layout 3 4
Ctrl+1=grid-disable
Ctrl+2=grid-layout 2 2
Ctrl+3=grid-layout 3 3
Ctrl+4=grid-layout 4 4
Ctrl+5=grid-layout 2 3
Ctrl+6=grid-layout 3 4

[grid-keys]
; These bindings are active only while a multi-tile Grid is displayed.
TAB=grid-cycle-active 1
Shift+TAB=grid-cycle-active -1
SPACE=grid-pause
Ctrl+SPACE=grid-pause-all
LEFT=grid-seek -1 -5 relative
RIGHT=grid-seek -1 5 relative
UP=grid-seek -1 30 relative
DOWN=grid-seek -1 -30 relative
m=grid-mute
Shift+m=grid-solo
+=grid-volume -1 0.05 add
-=grid-volume -1 -0.05 add
[=grid-speed -1 -0.1 add
]=grid-speed -1 0.1 add
b=grid-fixed-start
Ctrl+s=grid-save
Ctrl+Shift+s=grid-save
MBTN_LEFT=grid-mouse-zoom
MOUSE_MOVE=grid-zoom-move
